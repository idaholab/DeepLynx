x-insight-worker-env: &insight-worker-env
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  RABBITMQ_HOST: insight-rabbitmq
  PG_HOST: nx-postgres
  PG_PORT: "5432"
  PG_USER: postgres
  PG_PASSWORD: nexuscore
  PG_DBNAME: deeplynx

x-insight-worker-common: &insight-worker-common
  profiles: [insight]
  build:
    context: ./deeplynx.insight
    dockerfile: Dockerfiles/Dockerfile.runner.production
  env_file:
    - ./deeplynx.insight/.env
  depends_on:
    insight-rabbitmq:
      condition: service_healthy
    nx-postgres:
      condition: service_healthy
  networks:
    - nexus-network

x-insight-worker-storage: &insight-worker-storage
  <<: *insight-worker-common
  volumes:
    - object_storage:/data
    - insight_storage:/data/insight

services:
  ui:
    build:
      context: ./
      dockerfile: Dockerfiles/ui/Dockerfile.local
      args:
        OKTA_ISSUER: "https://identity-preview.inl.gov"
        NEXTAUTH_URL: "http://localhost:3000"
        REDIRECT_LINK: "http://localhost:3000/api/auth/callback/okta"
        NEXT_PUBLIC_DOCS_PATH: "http://localhost:3001/docs"
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
        OKTA_CLIENT_ID: ""
        OKTA_CLIENT_SECRET: ""
        NEXTAUTH_SECRET: "changeMe"
        BACKEND_BASE_URL: "http://server:5000"
        AUTH_TRUST_HOST: true
        NEXT_PUBLIC_DISABLE_FRONTEND_AUTHENTICATION: true # change to false if supplying okta info on lines 12-13, 25-26
    environment:
      NODE_ENV: production
      OKTA_ISSUER: "https://identity-preview.inl.gov"
      NEXTAUTH_URL: "http://localhost:3000"
      REDIRECT_LINK: "http://localhost:3000/api/auth/callback/okta"
      NEXT_PUBLIC_DOCS_PATH: "http://localhost:3001/docs"
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      OKTA_CLIENT_ID: ""
      OKTA_CLIENT_SECRET: ""
      NEXTAUTH_SECRET: "changeMe"
      BACKEND_BASE_URL: "http://server:5000"
      INSIGHT_API_URL: "http://insight-fastapi:5009"
      AUTH_TRUST_HOST: true
      NEXT_PUBLIC_DISABLE_FRONTEND_AUTHENTICATION: true # change to false if supplying okta info on lines 12-13, 25-26
    ports:
      - "3000:3000"
    networks:
      - nexus-network
    depends_on:
      - server

  docs:
    build:
      context: ./
      dockerfile: Dockerfiles/docs/Dockerfile.local
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    networks:
      - nexus-network
    depends_on:
      - server

  server:
    build:
      context: ./
      dockerfile: Dockerfiles/server/Dockerfile.local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexuscore
      POSTGRES_DB_NAME: deeplynx
      POSTGRES_DB_HOST: nx-postgres
      POSTGRES_PORT: 5432
      FILE_STORAGE_METHOD: filesystem # values can be filesystem, azure_object, and aws_s3
      STORAGE_DIRECTORY: /data
      DUCKDB_BASE_PATH: /data/duckdb
      RECOMMENDED_CHUNK_SIZE: 100000000
      AZURE_OBJECT_CONNECTION_STRING: azure-example-connection-string
      AZURE_CONTAINER_NAME: nexus-files
      AWS_S3_CONNECTION_STRING: aws-example-connection-string
      JWT_SECRET_KEY: demo_ZGDcnDdkRjLcx1kty9lXzlZ9L2ywFv3rC/91I3Z6fLQ= # for your local backend and can be changed
      JWT_ISSUER: https://identity-preview.inl.gov
      JWT_AUDIENCE: https://identity-preview.inl.gov
      SMTP_SERVER: mailhost.inl.gov
      SMTP_PORT: 25
      SMTP_ENABLE_SSL: false
      FROM_EMAIL: no-reply@inl.gov
      FROM_NAME: DeepLynx Nexus
      INVITE_URL: http://localhost:3000
      SUPPORT_EMAIL: jaren.brownlee@inl.gov
      DISABLE_BACKEND_AUTHENTICATION: true # change to false if supplying okta info on lines 12-13, 25-26
      SUPERUSER_EMAIL: jaren.brownlee@inl.gov
      INSIGHT_FASTAPI_URL: http://insight-fastapi:5009
      ENCRYPTION_KEY: SU5TRUNVUkVfREVWX0tFWV8zMl9CWVRFU19MT05HISE= # base64 encoded from the string "INSECURE_DEV_KEY_32_BYTES_LONG!!"
      ENCRYPTION_IV: SU5TRUNVUkVfREVWX0lWIQ== # base64 encoded from the string "INSECURE_DEV_IV!"
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://localhost:8080}
      AIRFLOW_JWT: ${AIRFLOW_JWT:-}
    ports:
      - "5000:5000"
      - "50051:50051"
    networks:
      - nexus-network
    volumes:
      - object_storage:/data
    depends_on:
      nx-postgres:
        condition: service_healthy

  nx-postgres:
    build:
      context: ./
      dockerfile: Dockerfiles/database/Dockerfile.local
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nexuscore
      - POSTGRES_DB=deeplynx
    ports:
      - "5432:5432"
    networks:
      - nexus-network
    volumes:
      - nx_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [
          "CMD-SHELL",
          "pg_isready -U postgres && psql -U postgres -d deeplynx -c 'SELECT
          1;'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    build:
      context: ./
      dockerfile: Dockerfiles/mcp/Dockerfile.local
    environment:
      NEXUS_API_URL: "http://server:5000"
      MCP_SERVER_URL: "http://0.0.0.0:43656"
    ports:
      - "43656:43656"
    networks:
      - nexus-network
    depends_on:
      - server

  insight-rabbitmq:
    profiles: [insight]
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.rabbitmq.production
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    env_file:
      - ./deeplynx.insight/.env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexus-network

  insight-fastapi:
    profiles: [insight]
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.fastapi.production
    ports:
      - "5009:5009"
    command:
      ["uvicorn", "app.fastapi.main:app", "--host", "0.0.0.0", "--port", "5009"]
    env_file:
      - ./deeplynx.insight/.env
    environment:
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      - RABBITMQ_HOST=insight-rabbitmq
      - PG_HOST=nx-postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=nexuscore
      - PG_DBNAME=deeplynx
    depends_on:
      insight-rabbitmq:
        condition: service_healthy
      nx-postgres:
        condition: service_healthy
    volumes:
      - object_storage:/data
      - insight_storage:/data/insight
    networks:
      - nexus-network

  insight-worker-file-downloader:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-file-downloader
    environment:
      <<: *insight-worker-env
      WORKER_NAME: file_downloader

  insight-worker-pdf-to-img:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-pdf-to-img
    environment:
      <<: *insight-worker-env
      WORKER_NAME: pdf_to_img

  insight-worker-image-file-to-image:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-image-file-to-image
    environment:
      <<: *insight-worker-env
      WORKER_NAME: image_file_to_image

  insight-worker-img-to-text:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-img-to-text
    environment:
      <<: *insight-worker-env
      WORKER_NAME: img_to_text

  insight-worker-txt-to-text:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-txt-to-text
    environment:
      <<: *insight-worker-env
      WORKER_NAME: txt_to_text

  insight-worker-text-to-chunks:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-text-to-chunks
    environment:
      <<: *insight-worker-env
      WORKER_NAME: text_to_chunks

  insight-worker-html-to-chunks:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-html-to-chunks
    environment:
      <<: *insight-worker-env
      WORKER_NAME: html_to_chunks

  insight-worker-docx-to-chunks:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-docx-to-chunks
    environment:
      <<: *insight-worker-env
      WORKER_NAME: docx_to_chunks

  insight-worker-tracking-service:
    <<: *insight-worker-storage
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-tracking-service
    environment:
      <<: *insight-worker-env
      WORKER_NAME: tracking_service

  insight-worker-ontology-to-vectors:
    <<: *insight-worker-common
    build:
      context: ./deeplynx.insight
      dockerfile: Dockerfiles/Dockerfile.runner.production
      args:
        WORKER_EXTRA: worker-ontology-to-vectors
    environment:
      <<: *insight-worker-env
      WORKER_NAME: ontology_to_vectors

  # lattice:
  #   build:
  #     context: ./deeplynx.lattice/postgres_rag_llm
  #     dockerfile: Dockerfile
  #   env_file: ./deeplynx.lattice/postgres_rag_llm/.env
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - nexus-network
  #   depends_on:
  #       - server

networks:
  nexus-network:
    driver: bridge

volumes:
  object_storage:
    driver: local
  insight_storage:
  nx_postgres_data:
    name: nx_postgres_data
