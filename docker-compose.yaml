services:
  ui:
    build:
      context: ./
      dockerfile: Dockerfiles/ui/Dockerfile.local
      args:
        OKTA_ISSUER: "https://identity-preview.inl.gov"
        NEXTAUTH_URL: "http://localhost:3000"
        REDIRECT_LINK: "http://localhost:3000/api/auth/callback/okta"
        NEXT_PUBLIC_DOCS_PATH: "http://localhost:3001/docs"
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
        OKTA_CLIENT_ID: ""
        OKTA_CLIENT_SECRET: ""
        NEXTAUTH_SECRET: "changeMe"
        BACKEND_BASE_URL: "http://server:5000/api/v1"
        AUTH_TRUST_HOST: true
        NEXT_PUBLIC_DISABLE_FRONTEND_AUTHENTICATION: true # change to false if supplying okta info on lines 12-13, 25-26
    environment:
      NODE_ENV: production
      OKTA_ISSUER: "https://identity-preview.inl.gov"
      NEXTAUTH_URL: "http://localhost:3000"
      REDIRECT_LINK: "http://localhost:3000/api/auth/callback/okta"
      NEXT_PUBLIC_DOCS_PATH: "http://localhost:3001/docs"
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
      OKTA_CLIENT_ID: ""
      OKTA_CLIENT_SECRET: ""
      NEXTAUTH_SECRET: "changeMe"
      BACKEND_BASE_URL: "http://server:5000/api/v1"
      INSIGHT_API_URL: "http://insight-fastapi:5009"
      AUTH_TRUST_HOST: true
      NEXT_PUBLIC_DISABLE_FRONTEND_AUTHENTICATION: true # change to false if supplying okta info on lines 12-13, 25-26
    ports:
      - "3000:3000"
    networks:
      - nexus-network
    depends_on:
      - server

  docs:
    build:
      context: ./
      dockerfile: Dockerfiles/docs/Dockerfile.local
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    networks:
      - nexus-network
    depends_on:
      - server

  server:
    build:
      context: ./
      dockerfile: Dockerfiles/server/Dockerfile.local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexuscore
      POSTGRES_DB_NAME: deeplynx
      POSTGRES_DB_HOST: nx-postgres
      POSTGRES_PORT: 5432
      FILE_STORAGE_METHOD: filesystem # values can be filesystem, azure_object, and aws_s3
      STORAGE_DIRECTORY: /data
      DUCKDB_BASE_PATH: /data/duckdb
      RECOMMENDED_CHUNK_SIZE: 100000000
      AZURE_OBJECT_CONNECTION_STRING: azure-example-connection-string
      AZURE_CONTAINER_NAME: nexus-files
      AWS_S3_CONNECTION_STRING: aws-example-connection-string
      JWT_SECRET_KEY: demo_ZGDcnDdkRjLcx1kty9lXzlZ9L2ywFv3rC/91I3Z6fLQ= # for your local backend and can be changed
      JWT_ISSUER: https://identity-preview.inl.gov
      JWT_AUDIENCE: https://identity-preview.inl.gov
      SMTP_SERVER: mailhost.inl.gov
      SMTP_PORT: 25
      SMTP_ENABLE_SSL: false
      FROM_EMAIL: no-reply@inl.gov
      FROM_NAME: DeepLynx Nexus
      INVITE_URL: http://localhost:3000
      SUPPORT_EMAIL: jaren.brownlee@inl.gov
      DISABLE_BACKEND_AUTHENTICATION: true # change to false if supplying okta info on lines 12-13, 25-26
      SUPERUSER_EMAIL: jaren.brownlee@inl.gov
      INSIGHT_FASTAPI_URL: http://insight-fastapi:5009
      ENCRYPTION_KEY: SU5TRUNVUkVfREVWX0tFWV8zMl9CWVRFU19MT05HISE= # base64 encoded from the string "INSECURE_DEV_KEY_32_BYTES_LONG!!"
      ENCRYPTION_IV: SU5TRUNVUkVfREVWX0lWIQ== # base64 encoded from the string "INSECURE_DEV_IV!"
      AIRFLOW_BASE_URL: http://localhost:8080
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
    entrypoint: /usr/local/bin/entrypoint.sh
    ports:
      - "5000:5000"
    networks:
      - nexus-network
    volumes:
      - object_storage:/data
    depends_on:
      db-version-check:
        condition: service_completed_successfully

  nx-postgres:
    build:
      context: ./
      dockerfile: Dockerfiles/database/Dockerfile.local
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nexuscore
      - POSTGRES_DB=deeplynx
    ports:
      - "5432:5432"
    networks:
      - nexus-network
    volumes:
      - nx_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres && psql -U postgres -d deeplynx -c 'SELECT 1;'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-version-check:
    image: postgres:18-alpine3.23
    networks:
      - nexus-network
    volumes:
      - ./Dockerfiles/database/check_db_version.sh:/scripts/check_db_version.sh
    environment:
      DB_HOST: nx-postgres
      DB_USER: postgres
      DB_PASSWORD: nexuscore
      DB_NAME: deeplynx
    command: >
      sh -c "
        apk add --no-cache bash &&
        chmod +x /scripts/check_db_version.sh &&
        /scripts/check_db_version.sh
      "
    depends_on:
      nx-postgres:
        condition: service_healthy

  mcp:
    build:
      context: ./
      dockerfile: Dockerfiles/mcp/Dockerfile.local
    environment:
      NEXUS_API_URL: "http://server:5000/api/v1"
      MCP_SERVER_URL: "http://0.0.0.0:43656"
    ports:
      - "43656:43656"
    networks:
      - nexus-network
    depends_on:
      - server

  insight-rabbitmq:
    profiles: [insight]
    build:
      context: ./deeplynx.insight/app/rabbitmq
      dockerfile: Dockerfiles/Dockerfile.production
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    env_file:
      - ./deeplynx.insight/.env.production
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexus-network

  insight-fastapi:
    profiles: [insight]
    build:
      context: ./deeplynx.insight
      dockerfile: app/fastapi/Dockerfiles/Dockerfile.production
    ports:
      - "5009:5009"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5009"]
    env_file:
      - ./deeplynx.insight/.env.production
    environment:
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      - RABBITMQ_HOST=insight-rabbitmq
      - PG_HOST=nx-postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=nexuscore
      - PG_DBNAME=deeplynx
    depends_on:
      insight-rabbitmq:
        condition: service_healthy
      db-version-check:
        condition: service_completed_successfully
    volumes:
      - object_storage:/data
      - insight_storage:/data/insight
    networks:
      - nexus-network

  insight-rabbitmq-runner:
    profiles: [insight]
    build:
      context: ./deeplynx.insight
      dockerfile: app/rabbitmq/Dockerfiles/Dockerfile.runner.production
    command: ["python", "-m", "runner"]
    env_file:
      - ./deeplynx.insight/.env.production
    environment:
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      - RABBITMQ_HOST=insight-rabbitmq
      - PG_HOST=nx-postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=nexuscore
      - PG_DBNAME=deeplynx
    depends_on:
      insight-rabbitmq:
        condition: service_healthy
      db-version-check:
        condition: service_completed_successfully
    volumes:
      - object_storage:/data
      - insight_storage:/data/insight
    networks:
      - nexus-network

  # lattice:
  #   build:
  #     context: ./deeplynx.lattice/postgres_rag_llm
  #     dockerfile: Dockerfile
  #   env_file: ./deeplynx.lattice/postgres_rag_llm/.env
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - nexus-network
  #   depends_on:
  #       - server

networks:
  nexus-network:
    driver: bridge

volumes:
  object_storage:
    driver: local
  insight_storage:
  nx_postgres_data:
    name: nx_postgres_data
