---
apiVersion: v1
kind: Service
metadata:
  name: deeplynxv3-service
  namespace: deeplynxv3-dev
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: deeplynxv3
---
apiVersion: v1
kind: Service
metadata:
  name: deeplynxv3-backend-service
  namespace: deeplynxv3-dev
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 5000
    - name: grpc
      port: 50051
      targetPort: 50051
  selector:
    app: deeplynxbackend
---
apiVersion: v1
kind: Service
metadata:
  name: deeplynxv3-docs-service
  namespace: deeplynxv3-dev
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3001
  selector:
    app: deeplynx-docs
---
apiVersion: v1
kind: Service
metadata:
  name: deeplynxv3-mcp-service
  namespace: deeplynxv3-dev
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 43656
  selector:
    app: deeplynx-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: insight-rabbitmq-service
  namespace: deeplynxv3-dev
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: prometheus
      port: 15692
      targetPort: 15692
  selector:
    app: insight-rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: insight-fastapi-service
  namespace: deeplynxv3-dev
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 5009
  selector:
    app: insight-fastapi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deeplynxv3-ingress
  namespace: deeplynxv3-dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Referrer-Policy: strict-origin";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_clear_headers "X-Powered-By";
      more_clear_headers "x-nextjs-cache";
      more_clear_headers "x-nextjs-prerender";
      more_clear_headers "x-nextjs-stale-time";
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: deeplynx.dev.inl.gov
      http:
        paths:
          - path: /_next/static
            pathType: Prefix
            backend:
              service:
                name: deeplynxv3-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deeplynxv3-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deeplynxv3-backend-service
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: deeplynxv3-service
                port:
                  number: 80
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: deeplynxv3-docs-service
                port:
                  number: 80
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: deeplynxv3-mcp-service
                port:
                  number: 80
          - path: /api/oauth
            pathType: Prefix
            backend:
              service:
                name: deeplynx-service
                port:
                  number: 80
