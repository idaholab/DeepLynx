# insight-worker-image-file-to-image
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insight-worker-image-file-to-image
  namespace: deeplynxv3-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: insight-worker-image-file-to-image
  template:
    metadata:
      labels:
        app: insight-worker-image-file-to-image
    spec:
      terminationGracePeriodSeconds: 120
      hostAliases:
        - ip: "10.6.17.82"
          hostnames:
            - "deeplynx-api.inl.gov"
      containers:
        - name: insight-worker-image-file-to-image
          image: ${CI_REGISTRY}/${CI_REGISTRY_PATH}:insight-worker-image-file-to-image-${GITHUB_RUN_NUMBER}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: insight-worker-config
          env:
            - name: WORKER_NAME
              value: "image_file_to_image"
            - name: RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: rabbitmq-default-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-default-pass
            - name: LLM_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: llm-auth-token
            - name: MM_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mm-auth-token
            - name: EMB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: emb-auth-token
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: encryption-key
            - name: ENCRYPTION_IV
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: encryption-iv
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: nexus-storage
              mountPath: /data/duckdb
              readOnly: true
            - name: insight-storage
              mountPath: /data/insight
      volumes:
        - name: nexus-storage
          persistentVolumeClaim:
            claimName: ${AZURE_FILE_SHARE_PVC}
        - name: insight-storage
          persistentVolumeClaim:
            claimName: insight-storage


