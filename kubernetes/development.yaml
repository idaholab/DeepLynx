            - "api.hpc.inl.gov"
      containers:
        - name: deeplynxv3
          image: ${CI_REGISTRY}/${CI_REGISTRY_PATH}:insight-rabbitmq-runner-${GITHUB_RUN_NUMBER}
          imagePullPolicy: Always
          command: ["python", "-m", "runner"]
          env:
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            - name: RABBITMQ_HOST
              value: "insight-rabbitmq-service"
            - name: RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: rabbitmq-default-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-default-pass
            - name: PG_HOST
              value: ${POSTGRES_DB_HOST}
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              value: ${POSTGRES_USER}
            - name: PG_PASSWORD
              value: ${POSTGRES_PASSWORD}
            - name: PG_DBNAME
              value: ${POSTGRES_DB_NAME}
            - name: LLM_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: llm-auth-token
            - name: MM_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mm-auth-token
            - name: EMB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: emb-auth-token
            - name: LLM_SERVER_URL
              value: "https://api.hpc.inl.gov/llm/v1"
            - name: LLM_MODEL_NAME
              value: "gpt-oss-120b"
            - name: MM_SERVER_URL
              value: "https://api.hpc.inl.gov/llm/v1"
            - name: MM_MODEL_NAME
              value: "Mistral-Small-3.2-24B-Instruct-2506"
            - name: EMB_SERVER_URL
              value: "https://api.hpc.inl.gov/llm/v1"
            - name: EMB_MODEL_NAME
              value: "bge-m3"
            - name: EMB_DIMENSION
              value: "1024"
            - name: IMG_TO_TEXT_PROCS
              value: "2"
            - name: IMG_TO_TEXT_BATCH_SIZE
              value: "20"
            - name: IMG_TO_TEXT_BATCH_TIMEOUT
              value: "0.5"
            - name: PDF_TO_IMG_PROCS
              value: "2"
            - name: TEXT_TO_CHUNKS_PROCS
              value: "2"
            - name: RAG_MAX_CHUNKS
              value: "25"
            - name: LITELLM_HTTP_LOGGING
              value: "false"
          resources:
            limits:
              memory: "4Gi"
              cpu: "1500m"
          volumeMounts:
            - name: insight-storage
              mountPath: /data/insight
      volumes:
