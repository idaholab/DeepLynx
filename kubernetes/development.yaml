# kubernetes yaml file for development
apiVersion: v1
kind: Namespace
metadata:
  name: deeplynxv3-dev
  labels:
    name: deeplynxv3-dev

# Secret for Azure Storage Account with SAS Token
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-secret
  namespace: deeplynxv3-dev
type: Opaque
stringData:
  azurestorageaccountname: ${AZURE_STORAGE_ACCOUNT_NAME}
  azurestorageaccountsastoken: ${AZURE_STORAGE_ACCOUNT_SAS_TOKEN}
  azurestorageaccountkey: ${AZURE_STORAGE_ACCOUNT_KEY}
  azurestorageconnectionstring: ${AZURE_OBJECT_CONNECTION_STRING}

# Persistent Volume pointing to existing Azure File Share
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ${AZURE_FILE_SHARE_PERSISTENT_VOLUME}
  namespace: deeplynxv3-dev
spec:
  capacity:
    storage: 60Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ${AZURE_FILE_SHARE_STORAGE_CLASS}
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=0
    - gid=0
    - mfsymlinks
    - cache=strict
    - actimeo=30
    - nobrl
  csi:
    driver: file.csi.azure.com
    readOnly: false
    volumeHandle: ${AZURE_FILE_SHARE_VOLUME_HANDLE} # Unique ID for this volume
    volumeAttributes:
      resourceGroup: ${AZURE_ACCOUNT_RESOURCE_GROUP}
      storageAccount: ${AZURE_STORAGE_ACCOUNT_NAME}
      shareName: duckdb-data
      protocol: smb
      server: ${AZURE_STORAGE_ACCOUNT_NAME}.file.core.usgovcloudapi.net
    nodeStageSecretRef:
      name: azure-storage-secret
      namespace: deeplynxv3-dev

# Storage Class (simplified for static provisioning)
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ${AZURE_FILE_SHARE_STORAGE_CLASS}
  namespace: deeplynxv3-dev
provisioner: file.csi.azure.com
parameters:
  skuName: Premium_LRS
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate

# Persistent Volume Claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${AZURE_FILE_SHARE_PVC}
  namespace: deeplynxv3-dev
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 60Gi
  storageClassName: ${AZURE_FILE_SHARE_STORAGE_CLASS}
  volumeName: ${AZURE_FILE_SHARE_PERSISTENT_VOLUME} # Bind to the specific PV
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deeplynxv3
  namespace: deeplynxv3-dev
spec:
  selector:
    matchLabels:
      app: deeplynxv3
  template:
    metadata:
      labels:
        app: deeplynxv3
    spec:
      containers:
        - name: deeplynxv3
          image: ${CI_REGISTRY}/${CI_REGISTRY_PATH}:deeplynxv3-ui-${GITHUB_RUN_NUMBER}
          imagePullPolicy: Always
          env:
            - name: AWS_S3_CONNECTION_STRING
              value: ${AWS_S3_CONNECTION_STRING}
            - name: AZURE_OBJECT_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: azurestorageconnectionstring
            - name: AZURE_CONTAINER_NAME
              value: ${AZURE_CONTAINER_NAME}
            - name: ConnectionStrings__DefaultConnection
              value: "${DATABASE_CONNECTION_STRING}"
            - name: FILE_STORAGE_METHOD
              value: ${FILE_STORAGE_METHOD}
            - name: STORAGE_DIRECTORY
              value: ${STORAGE_DIRECTORY}
            - name: LOGO_STORAGE_DIRECTORY
              value: /data/blob/images
            - name: RECOMMENDED_CHUNK_SIZE
              value: ${RECOMMENDED_CHUNK_SIZE}
            - name: POSTGRES_DB_HOST
              value: ${POSTGRES_DB_HOST}
            - name: POSTGRES_DB_NAME
              value: ${POSTGRES_DB_NAME}
            - name: POSTGRES_USER
              value: ${POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              value: ${POSTGRES_PASSWORD}
            - name: JWT_ISSUER
              value: ${JWT_ISSUER}
            - name: JWT_AUDIENCE
              value: ${JWT_AUDIENCE}
            - name: DUCKDB_BASE_PATH
              # DuckDB Configuration

              value: ${DUCKDB_BASE_PATH}
            - name: SMTP_SERVER
              value: ${SMTP_SERVER}
            - name: SMTP_PORT
              value: ${SMTP_PORT}
            - name: SMTP_ENABLE_SSL
              value: ${SMTP_ENABLE_SSL}
            - name: FROM_EMAIL
              value: ${FROM_EMAIL}
            - name: FROM_NAME
              value: ${FROM_NAME}
            - name: INVITE_URL
              value: ${INVITE_URL}
            - name: SUPPORT_EMAIL
              value: ${SUPPORT_EMAIL}
            - name: DISABLE_BACKEND_AUTHENTICATION
              value: ${DISABLE_BACKEND_AUTHENTICATION}
            - name: SUPERUSER_EMAIL
              value: ${SUPERUSER_EMAIL}
            - name: TENANT_MODE
              value: ${TENANT_MODE}
            - name: OKTA_CLIENT_SECRET
              # Runtime environment variables from secrets (sensitive)
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: okta-client-secret
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret-key
            - name: INSIGHT_API_URL
              value: "http://insight-fastapi-service"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: auth-secret
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: next-auth-secret
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: service-token
            - name: NEXT_PUBLIC_DISABLE_FRONTEND_AUTHENTICATION
              # Runtime environment variables from configmap (non-sensitive)
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: disabled-front-auth
            - name: OKTA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: okta-client-id
            - name: OKTA_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: okta-issuer
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: auth-url
            - name: REDIRECT_LINK
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: redirect-link
            - name: BACKEND_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: backend-base-url
          resources:
            limits:
              memory: "4Gi"
              cpu: "1500m"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: duckdb-storage
              mountPath: /data/duckdb
      volumes:
        - name: duckdb-storage
          persistentVolumeClaim:
            claimName: ${AZURE_FILE_SHARE_PVC}
